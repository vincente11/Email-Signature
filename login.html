<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f2">
  <title>Sign in — EFFICIENT SIGN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #1e2723;
      --muted: #707974;
      --line: #e6e8e3;
      --green: #245c45;
      --green-dark: #194a36;
      --canvas: #f1f2ef;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding: 24px 0 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
    }
    button, input { font: inherit; }
    .login-shell { width: min(420px, calc(100% - 48px)); margin: auto; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 11px; margin-bottom: 24px; font-weight: 700; letter-spacing: -.5px; }
    .brand-logo { width: 46px; height: 34px; object-fit: contain; }
    .brand-name { font-size: 18px; }
    .site-footer { margin-top: 24px; padding: 16px 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; text-align: center; }
    .card { padding: 30px; border: 1px solid var(--line); border-radius: 17px; background: white; box-shadow: 0 16px 42px rgba(31, 43, 36, .11); }
    h1 { margin: 0 0 8px; font-family: "Playfair Display", Georgia, serif; font-size: 32px; font-weight: 500; letter-spacing: -.7px; }
    .intro, .message { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .intro { margin: 0 0 22px; }
    .message { min-height: 21px; margin: 0 0 14px; overflow-wrap: anywhere; }
    .name-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .name-fields[hidden] { display: none; }
    .signature-note { margin: 8px 0 2px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    label { display: block; margin: 14px 0 6px; color: #59645d; font-size: 11px; font-weight: 600; }
    input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid #dfe3dd;
      border-radius: 8px;
      outline: none;
      font-size: 13px;
    }
    input:focus { border-color: #84a993; box-shadow: 0 0 0 3px rgba(36, 92, 69, .08); }
    .primary-button {
      width: 100%;
      min-height: 43px;
      margin-top: 18px;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: white;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .primary-button:hover { background: var(--green-dark); }
    .primary-button:disabled { opacity: .55; cursor: wait; }
    .switch-button { width: 100%; margin-top: 14px; padding: 6px; border: 0; background: transparent; color: var(--green); font-size: 11px; cursor: pointer; }
    .switch-button:hover { text-decoration: underline; }
    .back-link { display: block; margin-top: 20px; color: var(--muted); text-align: center; text-decoration: none; font-size: 11px; }
    .back-link:hover { color: var(--green); }
    @media (max-width: 480px) { .card { padding: 24px 20px; } }
  </style>
</head>
<body>
  <main class="login-shell">
    <div class="brand" aria-label="EFFICIENT SIGN">
      <img class="brand-logo" src="efficient-engineering-mark.png" alt="Efficient Engineering logo">
      <span class="brand-name">EFFICIENT SIGN</span>
    </div>
    <section class="card" aria-labelledby="heading">
      <h1 id="heading">Welcome back.</h1>
      <p id="intro" class="intro">Sign in to create and place your signature.</p>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <form id="authForm">
        <div id="nameFields" class="name-fields" hidden>
          <label for="firstName">First name
            <input id="firstName" type="text" autocomplete="given-name" maxlength="60" placeholder="First name" required disabled>
          </label>
          <label for="lastName">Surname
            <input id="lastName" type="text" autocomplete="family-name" maxlength="60" placeholder="Surname" required disabled>
          </label>
        </div>
        <p id="signatureNote" class="signature-note" hidden>Your first name and surname will appear in your PDF signature.</p>
        <label id="emailLabel" for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required>
        <label id="passwordLabel" for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="Password" required>
        <button id="submitButton" class="primary-button" type="submit">Sign in</button>
      </form>
      <button id="switchButton" class="switch-button" type="button">New here? Create an account</button>
      <a class="back-link" href="index.html">Back to PDF signing</a>
    </section>
  </main>
  <footer class="site-footer">Developed by Vincent Mlauzi</footer>
  <script>
    (() => {
      "use strict";

      const SUPABASE_URL = "https://mvfnycefnmpwtuoajliq.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_-_KnKaBRJLvTl2VLfNWTXA_FFpZvqcr";
      const form = document.getElementById("authForm");
      const nameFields = document.getElementById("nameFields");
      const firstNameInput = document.getElementById("firstName");
      const lastNameInput = document.getElementById("lastName");
      const signatureNote = document.getElementById("signatureNote");
      const emailLabel = document.getElementById("emailLabel");
      const emailInput = document.getElementById("email");
      const passwordLabel = document.getElementById("passwordLabel");
      const passwordInput = document.getElementById("password");
      const submitButton = document.getElementById("submitButton");
      const switchButton = document.getElementById("switchButton");
      const heading = document.getElementById("heading");
      const intro = document.getElementById("intro");
      const message = document.getElementById("message");
      let isSignUpMode = false;
      let isProfileCompletionMode = false;
      let authClient = null;

      function setMessage(text) {
        message.textContent = text;
      }

      function setMode(isSignUp) {
        isSignUpMode = isSignUp;
        isProfileCompletionMode = false;
        emailLabel.hidden = false;
        emailInput.hidden = false;
        emailInput.required = true;
        passwordLabel.hidden = false;
        passwordInput.hidden = false;
        passwordInput.required = true;
        switchButton.hidden = false;
        nameFields.hidden = !isSignUp;
        firstNameInput.disabled = !isSignUp;
        firstNameInput.required = isSignUp;
        lastNameInput.disabled = !isSignUp;
        lastNameInput.required = isSignUp;
        signatureNote.hidden = !isSignUp;
        heading.textContent = isSignUp ? "Create your account." : "Welcome back.";
        intro.textContent = isSignUp
          ? "Create an account with the name that will appear on your signature."
          : "Sign in to create and place your signature.";
        submitButton.textContent = isSignUp ? "Create account" : "Sign in";
        passwordInput.autocomplete = isSignUp ? "new-password" : "current-password";
        passwordInput.placeholder = isSignUp ? "At least 8 characters" : "Password";
        passwordInput.minLength = isSignUp ? 8 : 1;
        switchButton.textContent = isSignUp
          ? "Already have an account? Sign in"
          : "New here? Create an account";
      }

      function hasAccountName(user) {
        const metadata = user?.user_metadata || {};
        return Boolean(
          (typeof metadata.first_name === "string" && metadata.first_name.trim()) &&
          (typeof metadata.last_name === "string" && metadata.last_name.trim())
        ) || [
          metadata.display_name,
          metadata.displayName,
          metadata.full_name,
          metadata.name
        ].some((name) => typeof name === "string" && name.trim());
      }

      function setProfileCompletion(user) {
        isProfileCompletionMode = true;
        setMode(true);
        isProfileCompletionMode = true;
        firstNameInput.value = typeof user.user_metadata?.first_name === "string"
          ? user.user_metadata.first_name : "";
        lastNameInput.value = typeof user.user_metadata?.last_name === "string"
          ? user.user_metadata.last_name : "";
        nameFields.hidden = false;
        firstNameInput.disabled = false;
        firstNameInput.required = true;
        lastNameInput.disabled = false;
        lastNameInput.required = true;
        signatureNote.hidden = false;
        signatureNote.textContent = "Your name and surname will appear in your PDF signature.";
        emailLabel.hidden = true;
        emailInput.hidden = true;
        emailInput.required = false;
        passwordLabel.hidden = true;
        passwordInput.hidden = true;
        passwordInput.required = false;
        switchButton.hidden = true;
        heading.textContent = "Add your signer name.";
        intro.textContent = "Save your first name and surname to your account to continue signing.";
        submitButton.textContent = "Save name and continue";
      }

      async function handleSubmit(event) {
        event.preventDefault();
        if (!authClient) {
          setMessage("Authentication is unavailable. Check your internet connection and refresh.");
          return;
        }

        submitButton.disabled = true;
        setMessage(isProfileCompletionMode
          ? "Saving your signer name…"
          : isSignUpMode ? "Creating your account…" : "Signing in…");
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const firstName = firstNameInput.value.trim();
        const lastName = lastNameInput.value.trim();
        if ((isSignUpMode || isProfileCompletionMode) && (!firstName || !lastName)) {
          setMessage("Enter both your first name and surname to create your account.");
          submitButton.disabled = false;
          return;
        }
        const fullName = [firstName, lastName].filter(Boolean).join(" ");

        try {
          if (isProfileCompletionMode) {
            const { error } = await authClient.auth.updateUser({
              data: {
                first_name: firstName,
                last_name: lastName,
                full_name: fullName,
                display_name: fullName
              }
            });
            if (error) throw error;
            window.location.replace("index.html");
            return;
          }

          const result = isSignUpMode
            ? await authClient.auth.signUp({
              email,
              password,
              options: {
                data: {
                  first_name: firstName,
                  last_name: lastName,
                  full_name: fullName,
                  display_name: fullName
                }
              }
            })
            : await authClient.auth.signInWithPassword({ email, password });
          if (result.error) throw result.error;

          passwordInput.value = "";
          if (isSignUpMode) {
            if (result.data.session) {
              window.location.replace("index.html");
            } else {
              setMessage("Supabase did not start an account session. To disable confirmation emails, turn off Confirm email under Authentication → Sign In / Providers → Email. If you already have an account, switch to sign in.");
            }
            return;
          }
          if (!hasAccountName(result.data.user)) {
            setProfileCompletion(result.data.user);
            setMessage("Add your first name and surname to your account. They will appear automatically in your signature.");
            return;
          }
          window.location.replace("index.html");
        } catch (error) {
          console.error("Supabase authentication failed:", error);
          setMessage(error.message || "Authentication failed. Please try again.");
        } finally {
          submitButton.disabled = false;
        }
      }

      switchButton.addEventListener("click", () => {
        setMode(!isSignUpMode);
        setMessage("");
      });
      form.addEventListener("submit", handleSubmit);
      setMode(false);

      if (typeof window.supabase?.createClient !== "function") {
        form.hidden = true;
        switchButton.hidden = true;
        setMessage("Supabase couldn't load. Check your internet connection and refresh.");
        return;
      }

      const isProfileCompletionRequested = new URLSearchParams(window.location.search).get("complete-profile") === "1";
      authClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      authClient.auth.getSession().then(async ({ data, error }) => {
        if (error) throw error;
        let currentUser = null;
        if (data.session) {
          const { data: userData, error: userError } = await authClient.auth.getUser();
          if (userError) {
            console.error("Saved Supabase session is invalid:", userError);
            const { error: signOutError } = await authClient.auth.signOut({ scope: "local" });
            if (signOutError) throw signOutError;
            setMessage("Your saved session belongs to an account that no longer exists. Sign in again with your current account.");
            return;
          }
          currentUser = userData.user;
        }

        if (isProfileCompletionRequested) {
          if (!currentUser) {
            setMessage("Sign in first to add your name to your account.");
            return;
          }
          if (hasAccountName(currentUser)) {
            window.location.replace("index.html");
            return;
          }
          setProfileCompletion(currentUser);
          return;
        }
        if (currentUser) {
          if (hasAccountName(currentUser)) {
            window.location.replace("index.html");
          } else {
            setProfileCompletion(currentUser);
            setMessage("Add your first name and surname to your account. They will appear automatically in your signature.");
          }
        }
      }).catch((error) => {
        console.error("Supabase session restore failed:", error);
        setMessage("Couldn't check your session. Please try again.");
      });
    })();
  </script>
</body>
</html>
